on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
defaults:
  run:
    shell: bash
env:
  POSIXLY_CORRECT: y
permissions: { }
jobs:
  git-check:
    permissions:
      contents: read
    uses: mestriga-org/github-workflows/.github/workflows/git-check.yml@main
  pnpm-run-lint:
    permissions:
      contents: read
    uses: mestriga-org/github-workflows/.github/workflows/pnpm-run-lint.yml@main
  renovate-preset-validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /default.json
            /org-inherited-config.json
            !*/
      - name: renovate-config-validator
        uses: docker://renovate/renovate:42.81.3@sha256:29c7f75006d1db2dfabdb7c11498275daf8c67cd717e09162a53ebafa999cb13
        with:
          entrypoint: renovate-config-validator
          # TODO fix: all file args are validated as global config
          args: --strict default.json org-inherited-config.json
