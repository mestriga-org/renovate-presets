on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  git-check:
    permissions:
      contents: read
    uses: mestriga-org/github-workflows/.github/workflows/git-check.yml@main
  pnpm-run-lint:
    permissions:
      contents: read
    uses: mestriga-org/github-workflows/.github/workflows/pnpm-run-lint.yml@main
  renovate-config-validator:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          set-safe-directory: false
          persist-credentials: false
      - uses: renovatebot/github-action@v44.0.5
        with:
          docker-cmd-file: renovate-config-validator.sh
          token: ${{ secrets.GITHUB_TOKEN }}
          docker-volumes: .:/workspace:readonly
