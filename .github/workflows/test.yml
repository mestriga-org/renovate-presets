on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
defaults:
  run:
    shell: bash
env:
  POSIXLY_CORRECT: y
permissions: { }
jobs:
  renovate-config-validate:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    container: ghcr.io/renovatebot/renovate:42
    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)
