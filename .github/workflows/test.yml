on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
defaults:
  run:
    shell: bash
env:
  POSIXLY_CORRECT: y
permissions: { }
jobs:
  renovate-config-validate:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install nftables
      - uses: docker/setup-docker-action@v4
        with:
          version: 29.1.2
          daemon-config: |
            {
              "bridge": "none",
              "firewall-backend": "nftables"
            }
