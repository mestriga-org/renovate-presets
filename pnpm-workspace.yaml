packages: []

audit:
  ignorePrune: true

catalog:
  '@antfu/eslint-config': 9.5.1
  eslint: 10.10.0
catalogMode: strict

catalogPrune: true
dedupeDirectDeps: true
dedupePeers: true
disallowWorkspaceCycles: true
enablePrePostScripts: false
hoist: false
minimumReleaseAgeExcludePrune: true

nodeOptions: >-
  ${NODE_OPTIONS- }
  --no-addons
  --disable-proto=throw
  --force-context-aware
  --force-node-api-uncaught-exceptions-policy
  --frozen-intrinsics
  --no-global-search-paths
  --pending-deprecation
  --tls-min-v1.3

resolutionMode: lowest-direct
strictPeerDependencies: true

trustPolicyExclude:
  - '@yarnpkg/libzip@3.2.2'
  - semver@5.7.2 || 6.3.1
trustPolicyExcludePrune: true
