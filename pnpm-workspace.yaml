packages: []
catalog:
  '@antfu/eslint-config': 9.0.0
  eslint: 10.3.0
catalogMode: strict
cleanupUnusedCatalogs: true
dedupeDirectDeps: true
dedupePeers: true
disallowWorkspaceCycles: true
enablePrePostScripts: false
hoist: false
ignoreScripts: false
nodeOptions: >-
  ${NODE_OPTIONS- } --no-addons --disable-proto=throw --force-context-aware
  --force-node-api-uncaught-exceptions-policy --frozen-intrinsics
  --no-global-search-paths --tls-min-v1.3
resolutionMode: lowest-direct
strictPeerDependencies: true
trustPolicyExclude:
  - '@yarnpkg/libzip@3.2.2'
  - semver@5.7.2 || 6.3.1
